# Throwaway GPUI comparison app: part 1 of the native spike. Its own workspace and
# lockfile, unrelated to the Tauri app in src-tauri.
[package]
name = "sirus-native-spike"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }

serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Runs the JavaScript of conversation visuals (src/visuals).
rquickjs = "0.14.0"
alacritty_terminal = "0.26"
libc = "0.2"
similar = "2.7"
pulldown-cmark = "0.13"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tree-sitter-highlight = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9" }
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKNavigationAction", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSURL", "NSURLRequest", "NSData", "NSRange", "NSArray", "NSSet", "NSError", "NSBundle"] }

[workspace]
resolver = "2"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
debug = 0
