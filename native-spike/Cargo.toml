# Throwaway GPUI comparison app: part 1 of the native spike. Its own workspace and
# lockfile, unrelated to the Tauri app in src-tauri.
[package]
name = "sirus-native-spike"
version = "0.1.1"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }

serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Runs the JavaScript of conversation visuals (src/visuals).
rquickjs = "0.14.0"
alacritty_terminal = "0.26"
libc = "0.2"
similar = "2.7"
# The pairing QR code (Settings → Conexões); the host draws its own with the same crate.
qrcode = { version = "0.14", default-features = false }
pulldown-cmark = "0.13"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# Other computers (ADR-133): the wss:// socket and the HTTPS pairing run on rustls with ring and the
# system's roots; tungstenite gets the stream, so it needs no TLS feature.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# Attachment viewer: base64 payloads from the host, and the page rasters of PDFs.
base64 = "0.22"
# In-app updates: checks the minisign signature of the downloaded bundle (app_update.rs).
minisign-verify = "0.3"
image = { version = "0.25", default-features = false }
smallvec = "1"
# Attachment viewer: the Office files' zip parts and their XML, read in Rust (no scripting engine).
miniz_oxide = "0.8"
roxmltree = "0.21"
tree-sitter-highlight = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-scss = "1.0.0"
tree-sitter-less = "1.0.0"
tree-sitter-zig = "1.1.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The paired computers' tokens live in the Keychain (computers.rs).
security-framework = "3"
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9" }
objc2 = "0.6"
block2 = "0.6"
# The quick composer's global shortcut and its menu bar icon (quick_composer.rs).
global-hotkey = "0.8"
tray-icon = { version = "0.25", default-features = false }
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSSound", "NSResponder", "NSView", "NSWindow", "NSBitmapImageRep", "NSImageRep", "NSImage", "NSApplication", "NSRunningApplication", "NSPasteboard", "NSAppearance", "NSGraphics", "NSPanel", "NSScreen", "NSStringDrawing"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKNavigationAction", "WKNavigationResponse", "WKHTTPCookieStore", "WKPreferences", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKUserScript", "WKSnapshotConfiguration", "WKUIDelegate", "WKWindowFeatures", "WKContentWorld", "WKFrameInfo", "WKWebsiteDataRecord", "block2"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSettings", "UNNotificationResponse"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSURL", "NSURLRequest", "NSData", "NSRange", "NSArray", "NSSet", "NSError", "NSBundle", "NSDictionary", "NSValue", "NSObject", "NSEnumerator", "NSDate", "NSHTTPCookie", "NSUUID", "NSNotification"] }

[workspace]
resolver = "2"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
debug = 0
